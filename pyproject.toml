[project]
name = "jev-test"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "gradio>=6.28.0",
    "jev>=0.3.0",
    "pydantic==2.14.0b2",
    "python-dotenv>=1.2.3",
    "typesafe-sdk>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
